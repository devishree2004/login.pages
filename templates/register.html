<!DOCTYPE html>
<html>
<head>
    <title>Register - Student Portal</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f6fb;
        }

        .container {
            width: 350px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2458a6;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
        }

        a {
            color: #2458a6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <p>Create your account</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/register" method="post">

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter full name"
            maxlength="100"
            required
        >

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email address"
            maxlength="150"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            minlength="8"
            required
        >

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

    <a href="/">Back to Home</a>

</div>

</body>
</html>
