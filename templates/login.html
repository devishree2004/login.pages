<!DOCTYPE html>
<html>
<head>
    <title>Login - Student Portal</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f6fb;
        }

        .container {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2458a6;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        a {
            color: #2458a6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Login</h1>

    <p>Login to your account</p>

    {% if message %}
        <p class="success">{{ message }}</p>
    {% endif %}

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/login" method="post">

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>

    <a href="/">Back to Home</a>

</div>

</body>
</html>
