<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Student Portal</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f6fb;
            margin: 0;
        }

        nav {
            background: #172b4d;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
        }

        .info {
            background: #f3f6fb;
            padding: 20px;
            border-radius: 8px;
        }

        button {
            padding: 12px 25px;
            background: #d62828;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<nav>
    <h2>Student Portal - Dashboard</h2>
</nav>

<div class="container">

    <h1>Welcome, {{ user.name }}!</h1>

    <p>Your account information</p>

    <div class="info">

        <p>
            <strong>Student ID:</strong>
            {{ user.id }}
        </p>

        <p>
            <strong>Full Name:</strong>
            {{ user.name }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ user.email }}
        </p>

        <p>
            <strong>Role:</strong>
            {{ user.role }}
        </p>

    </div>

    <br>

    <form action="/logout" method="post">
        <button type="submit">Logout</button>
    </form>

</div>

</body>
</html>
